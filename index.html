<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuvana Links</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- LottieFiles Player -->
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(8px); /* Efek blur pada latar belakang */
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.5s ease-in-out;
            z-index: 1000;
        }

        .fade-out {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body class="opacity-0">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <!-- Lottie Animation -->
        <lottie-player src="https://assets10.lottiefiles.com/packages/lf20_yt2uoeE83o.json"  background="transparent"  speed="1"  style="width: 150px; height: 150px;"  loop autoplay></lottie-player>
    </div>

    <!-- Main Content -->
    <div id="main-content" class="container mx-auto p-6 max-w-sm text-center transform transition-all duration-700 opacity-0 scale-95">
        <!-- Logo -->
        <div class="mb-8">
            <!-- Gunakan URL gambar placeholder. Anda bisa menggantinya dengan logo asli Neuvana. -->
            <img src="https://placehold.co/150x150/333333/FFFFFF?text=Neuvana+Logo" alt="Neuvana Logo" class="mx-auto rounded-full shadow-lg">
        </div>

        <!-- Tombol Link -->
        <div class="space-y-4">
            <!-- Tautan Website Pembelian yang telah diperbarui -->
            <a href="https://clients.neuvana.id/store" target="_blank" rel="noopener noreferrer" class="block w-full py-3 px-6 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                Website Pembelian
            </a>
            <a href="https://wa.me/6285117546674" target="_blank" rel="noopener noreferrer" class="block w-full py-3 px-6 bg-green-600 hover:bg-green-700 text-white font-semibold rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                Whatsapp CS
            </a>
            <a href="https://discord.gg/BqA28emFvg" target="_blank" rel="noopener noreferrer" class="block w-full py-3 px-6 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow-md transition-all duration-300 transform hover:scale-105 hover:shadow-xl focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 focus:ring-offset-gray-900">
                Discord Server
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            const loadingOverlay = document.getElementById('loading-overlay');
            const mainContent = document.getElementById('main-content');
            const body = document.body;

            // Fade out the loading overlay
            loadingOverlay.classList.add('fade-out');

            // Wait for the fade-out transition to finish before hiding it
            loadingOverlay.addEventListener('transitionend', () => {
                loadingOverlay.style.display = 'none';

                // Fade in the main content and scale it up
                body.classList.remove('opacity-0');
                mainContent.classList.remove('opacity-0', 'scale-95');
                mainContent.classList.add('opacity-100', 'scale-100');
            });
        });
    </script>
</body>
</html>
